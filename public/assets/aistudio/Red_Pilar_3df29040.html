<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Pilar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#253750;--bl:#368CD4;--card:#2B5F96;--am:#CF8838;--rd:#ED1C37}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent}
.hd{font-family:'Plus Jakarta Sans',sans-serif}
.inp{width:100%;background:#F7F7F7;color:#1C2A3D;border-radius:1rem;padding:.8rem 1rem;font-size:14px;border:0;outline:0;text-align:left}
.inp:focus{box-shadow:0 0 0 2px var(--bl)}.inp::placeholder{color:#687B94}
.card{background:var(--card);border-radius:1.5rem;padding:1rem}
.btn{background:var(--rd);color:#fff;border-radius:9999px;padding:.85rem 1.5rem;font:700 15px 'Plus Jakarta Sans';display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
.btn.o{background:rgba(54,140,212,.1);border:1.5px solid var(--bl)}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:3px 11px;font:700 11px 'Plus Jakarta Sans';color:#fff}
.sm{background:rgba(0,0,0,.28);border-radius:9999px;padding:.45rem .9rem;font:600 12px 'Plus Jakarta Sans';display:inline-flex;gap:6px;align-items:center}
.ic{width:44px;height:44px;border-radius:50%;flex:none}
.pan{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:#F7F7F7;color:#1C2A3D;border-radius:1rem;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}
.pan .l{max-height:50vh;overflow:auto}
.pan .g{font:800 10px 'Plus Jakarta Sans';color:#368CD4;padding:8px 14px 2px;letter-spacing:.06em}
.pan .h{font:700 12px 'Plus Jakarta Sans';background:#e4e9f0;padding:6px 14px;position:sticky;top:0}
.it{display:flex;gap:10px;align-items:center;padding:9px 14px;font-size:14px;width:100%;text-align:left}
.it:hover{background:#e8eef6}.it i{margin-left:auto;font-size:11px;color:#687B94}
.cb{width:18px;height:18px;border:2px solid #9aa9bd;border-radius:5px;flex:none}.cb.on{background:#368CD4;border-color:#368CD4}
.view{display:none;max-width:640px;margin:0 auto;padding:14px 16px 40px}.view.on{display:block}
.st{border-radius:1.5rem;padding:1.1rem 1.2rem}
.num{width:30px;height:30px;border-radius:50%;background:transparent;border:2px solid var(--am);color:var(--am);display:grid;place-items:center;font:800 13px 'Plus Jakarta Sans';flex:none;box-sizing:border-box;transition:.2s}
.num.done{background:var(--am);color:#fff}
.stp{position:relative;padding-left:46px;padding-bottom:22px}.stp:before{content:'';position:absolute;left:14px;top:34px;bottom:2px;width:2px;background:rgba(255,255,255,.2)}.stp:last-child:before{display:none}
.stp>.num{position:absolute;left:0;top:0}
.lock>.bd{opacity:.4;pointer-events:none}
.ov{position:fixed;inset:0;z-index:90;background:rgba(10,18,32,.6);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
.err{background:rgba(237,28,55,.18);border:1px solid var(--rd);border-radius:1rem;padding:.6rem .9rem;font-size:13px;margin-top:8px}
.vb{border-radius:1rem;background:rgba(0,0,0,.22);padding:.8rem;display:flex;gap:8px;align-items:center;font:600 13px 'Plus Jakarta Sans';border:2px solid transparent}
.vb.on{border-color:#fff;background:rgba(0,0,0,.4)}.vb b{margin-left:auto}
</style></head><body>

<div class="card" style="margin-top:14px"><h2 class="hd" style="font-size:17px;margin:0 0 2px">Confirmá este aviso</h2><p style="font-size:12px;opacity:.85;margin:0 0 10px">Sin moderadores: el estado cambia según la mayoría de los votos.</p><input id="cm" class="inp" maxlength="140" placeholder="¿Querés agregar una aclaración? (opcional)" value="${my?esc(my.c||''):''}"><div id="ce"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">${O.map(o=>`<button class="vb ${my&&my.o==o[0]?'on':''}" data-o="${o[0]}" style="${my&&my.o==o[0]?`background:${VC[o[0]][0]};border-color:${VC[o[0]][0]};color:${VC[o[0]][1]}`:''}">${o[1]}<b>${c[o[0]]||0}</b></button>`).join('')}</div>
<h3 class="hd" style="font-size:14px;margin:16px 0 6px">Últimos aportes</h3>${[...Object.values(a.v).filter(x=>x.c).map(x=>x.c),...a.cm.map(x=>x.t)].map(t=>`<div style="background:rgba(0,0,0,.2);border-radius:1rem;padding:.6rem .8rem;font-size:13px;margin-bottom:6px">${esc(t)}</div>`).join('')||'<p style="font-size:12px;opacity:.8">Todavía no hay aportes.</p>'}</div>
${near.length?`<h2 class="hd" style="font-size:17px;margin:20px 0 8px">Otras alertas en la zona</h2><div style="display:grid;gap:8px">${near.map(n=>`<div class="card near" data-id="${n.id}" style="display:flex;gap:10px;align-items:center;cursor:pointer"><img class="ic" src="${IC[n.cat]}" alt=""><b class="hd" style="font-size:13px;flex:1">${esc(n.title)}</b>${pill(n.status)}</div>`).join('')}</div>`:''}
${a.owner==ME&&a.status=='En verificación'?'<button class="btn o" id="del" style="margin-top:22px;border-color:var(--rd)">🗑 Eliminar aviso</button>':''}`;
$('#bk').onclick=back;$('#sh').onclick=()=>share(a);
document.querySelectorAll('.near').forEach(n=>n.onclick=()=>go('detail',n.dataset.id));
document.querySelectorAll('.vb').forEach(b=>b.onclick=()=>{const t=$('#cm').value.trim(),e=mod(t);if(e){$('#ce').innerHTML=`<div class="err">⚠ ${e}</div>`;return}a.v[ME]={o:b.dataset.o,c:t};const d=recompute(a);save();if(d){toast('El aviso fue eliminado por la comunidad');nav=[];cur='home';render()}else render()});
if($('#del'))$('#del').onclick=()=>ask('¿Seguro que querés eliminar este aviso? Podés volver a crearlo.','Sí, eliminar','Cancelar',y=>{if(y){S.av=S.av.filter(x=>x!==a);save();nav=[];go('home',null,false)}})}
function form(r){const F={zone:null,ref:'',cat:'',sub:'',txt:'',media:[],gps:null};
r.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><button class="sm" id="bk">← Volver</button></div><h1 class="hd" style="font-size:28px;font-weight:800;margin:10px 0 4px">Formulario de aviso</h1><p style="font-size:13px;opacity:.9;margin:0 0 18px">Cinco pasos y listo. Un asistente redactará el título y el resumen con lo que cuentes.</p>
<div class="stp" id="p1"><div class="num">1</div><h2 class="hd" style="font-size:18px;margin:3px 0 10px">Ubicación</h2><div class="bd"><button class="btn o" id="gps" style="margin-bottom:6px">◎ Usar mi ubicación actual (GPS)</button><div id="gm"></div><p class="hd" style="text-align:center;font-size:10.5px;letter-spacing:.07em;font-weight:700;margin:10px 0">O ELEGÍ LA ZONA DE LA LISTA</p><div id="zf"></div><input id="rf" class="inp" style="margin-top:8px" placeholder="Referencia o altura (ej.: Eva Perón al 1200)"><div id="re"></div></div></div>
<div class="stp lock" id="p2"><div class="num">2</div><h2 class="hd" style="font-size:18px;margin:3px 0 4px">Categoría</h2><div class="lk" style="font-size:11px;opacity:.8;margin-bottom:8px">Completá el paso anterior para seguir</div><div class="bd" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${Object.keys(IC).map(c=>`<button class="card ct" data-c="${c}" style="text-align:left;border:2px solid transparent;padding:.8rem"><img class="ic" src="${IC[c]}" alt="" style="width:36px;height:36px"><b class="hd" style="display:block;font-size:13px;margin-top:6px">${c}</b><small style="font-size:11px;opacity:.85">${CATD[c]}</small></button>`).join('')}</div></div>
<div class="stp lock" id="p3"><div class="num">3</div><h2 class="hd" style="font-size:18px;margin:3px 0 4px">Subcategoría</h2><div class="lk" style="font-size:11px;opacity:.8;margin-bottom:8px">Completá el paso anterior para seguir</div><div class="bd"><select id="sb" class="inp"><option value="">Elegí una opción</option></select></div></div>
<div class="stp lock" id="p4"><div class="num">4</div><h2 class="hd" style="font-size:18px;margin:3px 0 4px">Detalle</h2><div class="lk" style="font-size:11px;opacity:.8;margin-bottom:8px">Completá el paso anterior para seguir</div><div class="bd"><p style="font-size:13px;margin:0 0 8px">Contá qué está pasando: escribilo o grabá tu voz.</p><textarea id="tx" class="inp" rows="4" maxlength="2000" placeholder="Ej.: Corte de luz desde las 18 hs en toda la cuadra..."></textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><button class="sm" id="vc" type="button">🎙 Grabar con la voz</button><span id="ct" style="font-size:12px;display:none"></span></div><div id="te"></div><p style="font-size:11.5px;opacity:.85;margin:8px 0 0">Un asistente redacta el título y un resumen corto con la información que dejes.</p></div></div>
<div class="stp lock" id="p5"><div class="num">5</div><h2 class="hd" style="font-size:18px;margin:3px 0 4px">Evidencia <small style="font-weight:500;opacity:.8">(opcional)</small></h2><div class="lk" style="font-size:11px;opacity:.8;margin-bottom:8px">Completá el paso anterior para seguir</div><div class="bd"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="btn o" style="font-size:13px">📷 Sacar foto<input type="file" accept="image/*" capture="environment" id="ph" hidden></label><label class="btn o" style="font-size:13px">🎥 Grabar video<input type="file" accept="video/*" capture="environment" id="vd" hidden></label></div><p style="font-size:11.5px;opacity:.85;margin:8px 0">Solo cámara, sin galería. Podés sumar hasta 5 fotos o videos.</p><div id="mp" style="display:flex;gap:6px;flex-wrap:wrap"></div></div></div>
<button class="btn" id="sd" disabled>Enviar</button><p style="font-size:12px;text-align:center;margin-top:10px;opacity:.9">Tu aviso se publica como <b style="color:#FFC27A">En verificación</b> hasta que los vecinos lo confirmen. No hay moderadores.</p>`;
const done=[()=>F.zone,()=>F.cat,()=>F.sub,()=>F.txt.trim().length>=10];
function upd(){const d=done.map(f=>!!f());[1,2,3,4,5].forEach(n=>{const p=$('#p'+n),unl=n==1||d[n-2];p.classList.toggle('lock',!unl);p.querySelector('.lk')&&(p.querySelector('.lk').style.display=unl?'none':'');p.querySelector('.num').classList.toggle('done',n<5?d[n-1]:F.media.length>0)});$('#sd').disabled=!d.every(Boolean)}
$('#bk').onclick=back;
const zs=zoneSel($('#zf'),false,()=>F.zone?[F.zone]:[],s=>{F.zone=s[0];F.gps=null;$('#gm').innerHTML='';upd()});
$('#rf').oninput=e=>{F.ref=e.target.value;const m=mod(F.ref);$('#re').innerHTML=m?`<div class="err">⚠ ${m}</div>`:''};
$('#gps').onclick=()=>{const g=$('#gm');const fail=()=>{g.innerHTML='<div class="err">No pudimos obtener tu ubicación. Podés elegir la zona de la lista.</div>'};if(!navigator.geolocation)return fail();g.innerHTML='<p style="font-size:12px">Buscando ubicación…</p>';navigator.geolocation.getCurrentPosition(p=>{let b=null,bd=1e9;Z.forEach(z=>{const d=(z.lat-p.coords.latitude)**2+(z.lon-p.coords.longitude)**2;if(d<bd){bd=d;b=z}});const br=b.a.includes(b.n.replace(' (Centro)','').replace('Pilar Sur','Villa Verde'))?b.n.replace(' (Centro)',''):b.a[0];F.zone=br+'|'+b.n;F.gps={lat:p.coords.latitude,lon:p.coords.longitude};zs.draw();g.innerHTML=`<div style="background:rgba(34,165,89,.25);border:1px solid #22A559;border-radius:1rem;padding:.6rem .9rem;font-size:13px"><b>✔ Ubicación exacta cargada</b><br>${esc(br)}, ${esc(b.n)} (${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)})</div>`;upd()},fail,{enableHighAccuracy:true,timeout:12000})};
document.querySelectorAll('.ct').forEach(b=>b.onclick=()=>{F.cat=b.dataset.c;F.sub='';document.querySelectorAll('.ct').forEach(x=>x.style.borderColor=x==b?'#fff':'transparent');$('#sb').innerHTML='<option value="">Elegí una opción</option>'+SUBS[F.cat].map(s=>`<option>${s}</option>`).join('');upd()});
$('#sb').onchange=e=>{F.sub=e.target.value;upd()};
$('#tx').oninput=e=>{F.txt=e.target.value;$('#ct').textContent=F.txt.length+'/2000';$('#ct').style.display=F.txt.length>=1800?'':'none';const m=mod(F.txt);$('#te').innerHTML=m?`<div class="err">⚠ ${m}</div>`:'';upd()};
$('#vc').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Tu navegador no permite dictar por voz');const s=new R();s.lang='es-AR';s.onresult=e=>{const t=e.results[0][0].transcript;$('#tx').value=($('#tx').value+' '+t).trim().slice(0,200);$('#tx').dispatchEvent(new Event('input'))};s.onerror=()=>toast('No pudimos usar el micrófono');$('#vc').textContent='🎙 Escuchando…';s.onend=()=>$('#vc').textContent='🎙 Grabar con la voz';s.start()};
['ph','vd'].forEach(id=>$('#'+id).onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(F.media.length>=5)return toast('Máximo 5 fotos o videos');const u=URL.createObjectURL(f);F.media.push({u,v:f.type.startsWith('video'),f});$('#mp').innerHTML=F.media.map(m=>m.v?`<video src="${m.u}" style="width:64px;height:64px;border-radius:12px;object-fit:cover"></video>`:`<img src="${m.u}" style="width:64px;height:64px;border-radius:12px;object-fit:cover">`).join('');upd()});
$('#sd').onclick=()=>{const bad=mod(F.ref)||mod(F.txt);if(bad){toast('Revisá los campos marcados');$('#te').innerHTML=`<div class="err">⚠ ${bad}</div>`;return}
const[br,lc]=F.zone.split('|'),clean=F.txt.replace(/\s+/g,' ').trim();
const a={id:'n'+Date.now(),cat:F.cat,title:F.sub+' en '+br,zone:br,loc:lc,txt:clean+(F.ref?' ('+F.ref+')':''),ts:Date.now(),status:'En verificación',owner:ME,lat:F.gps?F.gps.lat:null,lon:F.gps?F.gps.lon:null,b:{si:0,no:0,proc:0,fin:0},cm:[],v:{}};const im=F.media.find(m=>!m.v);if(im)a.media=im.u;S.av.unshift(a);save();
const o=modal(`<button id="x" style="position:absolute;right:16px;top:12px;font-size:22px">✕</button><div style="width:60px;height:60px;border-radius:50%;background:#fff;color:#368CD4;display:grid;place-items:center;font-size:32px;font-weight:800;margin-bottom:14px">✓</div><p class="hd" style="font-size:20px;font-weight:800;margin:0 0 10px">Tu aviso ha sido ingresado como</p><span class="pill" style="background:#CF8838;font-size:13px;padding:5px 14px">En verificación</span><p style="font-size:14px;margin:14px 0">Compartilo con tus vecinos para que lo confirmen entre todos: cuanto antes se sabe qué está pasando, más rápido se difunde en el barrio</p><div style="display:grid;gap:8px"><button class="btn" id="s2" style="background:#fff;color:#1C2A3D">Compartir el aviso</button><button class="btn" id="h2" style="background:#fff;color:#1C2A3D">Volver a la bandeja principal</button></div>`,'');o.firstChild.style.background='#368CD4';
const exit=()=>{o.close();nav=[];go('home',null,false)};$('#x').onclick=exit;$('#h2').onclick=exit;$('#s2').onclick=()=>share(a)};
upd()}
function pending(){const p=S.nt.filter(n=>!n.r);if(!p.length)return;const o=modal(`<div style="font-size:38px;margin-bottom:8px">🗑</div><p class="hd" style="font-weight:700;font-size:17px;margin:0 0 14px">${p.map(n=>esc(n.t)).join('<br><br>')}</p><button class="btn" id="ok" style="background:#fff;color:#1C2A3D">Entendido</button>`,'');o.firstChild.style.background='#368CD4';p.forEach(n=>n.r=1);save();o.querySelector('#ok').onclick=()=>o.close()}
async function incog(){try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();if(e.quota&&e.quota<120*1024*1024)return true}}catch(x){}return false}
async function boot(){if(await incog()){$('#app').innerHTML=`<div class="ov" style="background:var(--bg);backdrop-filter:none"><div style="text-align:center;max-width:340px">${logo.replace('<div class="hd"','<div class="hd" style="display:inline-block;text-align:center"')}<div style="font-size:54px;color:var(--am);margin:28px 0 8px">⚠</div><h1 class="hd" style="font-size:24px;margin:0 0 10px">Red Pilar no funciona en modo incógnito</h1><p style="font-size:14px;opacity:.9;margin:0 0 20px">Para cuidar la confianza de los avisos y evitar votos repetidos, abrí la página en una pestaña normal del navegador.</p><button class="btn" style="background:var(--bl)" onclick="location.reload()">Ya la abrí en una pestaña normal</button></div></div>`;return}
const m=location.hash.match(/aviso=(\w+)/);if(m&&S.av.find(a=>a.id==m[1])){cur='detail';curId=m[1];nav=[['home',null]]}render();pending()}
boot();
</script></body></html>
